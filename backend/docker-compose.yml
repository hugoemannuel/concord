services:
  postgres:
    # Versão fixa: trocar a imagem recria o container (scripts/deploy-vps.sh
    # só faz isso com --infra).
    image: postgres:17.11
    container_name: concord-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: concord-user
      POSTGRES_PASSWORD: concord-password
      POSTGRES_DB: concord

    ports:
      # Só local: numa VPS sem firewall o banco não pode ficar exposto.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    volumes:
      - concord_postgres_data:/var/lib/postgresql/data

  # Servidor de mídia (SFU). Toda a voz/vídeo/tela passa por aqui.
  # Rede do host: o LiveKit precisa enxergar as interfaces reais (IP da LAN)
  # e escutar UDP/TCP direto, sem o NAT do Docker no meio.
  livekit:
    image: livekit/livekit-server:v1.13.11
    container_name: concord-livekit
    restart: unless-stopped
    network_mode: host

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # A sinalização (/rtc) chega pelo Caddy, que a manda direto para cá na
      # VPS (deploy/Caddyfile); no PC de casa, pelo proxy /rtc do backend.
      # Não edite o texto do LIVEKIT_CONFIG à toa (nem os comentários dentro
      # dele): ele vira variável do container, e qualquer mudança exige
      # recriar o LiveKit, o que derruba todas as chamadas.
      # node_ip = IP público do túnel do playit (PC de casa). Vazio no dev e
      # na VPS: o LiveKit usa o IP da máquina (na VPS, preencher faz ele
      # descartar o ICE por IPv4). As portas rtc precisam ser IGUAIS às
      # portas públicas do túnel, porque o LiveKit anuncia a própria porta.
      LIVEKIT_CONFIG: |
        port: ${LIVEKIT_PORT:-7880}
        # API/sinalização só local (o backend faz proxy de /rtc); a mídia
        # (rtc.tcp_port/udp_port) continua aberta.
        bind_addresses: ["127.0.0.1"]
        log_level: info
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: false
          node_ip: "${LIVEKIT_NODE_IP:-}"
          advertise_internal_ip: true
          # O agente do playit (ou o WireGuard da VPS) entrega a mídia em
          # 127.0.0.1 — sem isso o LiveKit não abre socket UDP no loopback.
          enable_loopback_candidate: true
        # Detecção de fala mais rápida (padrão: 400 ms × média de 2 = ~1 s de
        # atraso para ficar verde).
        audio:
          active_level: 35
          min_percentile: 40
          update_interval: 150
          smooth_intervals: 1
        room:
          empty_timeout: 300
          max_participants: 25
        # Métricas (Prometheus) só em 127.0.0.1 (bind_addresses): o backend
        # coleta a cada minuto (internal/liveobs, ADR 0029).
        prometheus:
          port: ${LIVEKIT_PROMETHEUS_PORT:-6789}

  # Opcional (Maestro): gera PO tokens para o yt-dlp quando o YouTube marca o
  # IP do servidor como bot. Ligar: docker compose --profile music up -d
  # e MUSIC_POT_URL=http://127.0.0.1:4416 no .env.
  bgutil-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: concord-bgutil-pot
    profiles: ["music"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"

volumes:
  concord_postgres_data:
