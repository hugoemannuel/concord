# /etc/ssh/sshd_config.d/00-salinha.conf — SSH só por chave (docs/HOSPEDAGEM.md,
# "Portas abertas na VPS"). O nome começa com 00 porque no sshd vale o primeiro
# valor lido, e provedores deixam arquivos (50-cloud-init.conf...) ligando a
# senha. Antes de aplicar: sua chave em /root/.ssh/authorized_keys e uma
# conexão por chave testada. Depois: sshd -t && systemctl reload ssh.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
