# appId continua o do Concord (nome antigo): é ele que faz a versão nova
# substituir a instalação antiga em vez de instalar um segundo app.
appId: com.concord.app
productName: Salinha
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  # Build web (yarn build:web) e a config dele: não vão no instalador.
  - '!{vite.web.config.ts,vite.renderer.shared.ts}'
  - '!{dist-web,web-public}/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/win/**'
  - '!resources/host/**'
  - '!**/*.test.ts'
asarUnpack:
  - resources/**
  # Atalhos globais com botão do mouse: o binário nativo precisa ficar fora do asar.
  - node_modules/uiohook-napi/**
# Licença da fonte Outfit (OFL-1.1): legível fora do asar. O renderer também
# leva uma cópia em out/renderer/assets/OFL.txt (vite.renderer.shared.ts).
extraResources:
  - from: node_modules/@fontsource-variable/outfit/LICENSE
    to: licenses/Outfit-OFL.txt
  - from: node_modules/@fontsource/bitter/LICENSE
    to: licenses/bitter-OFL.txt
  - from: node_modules/@fontsource/pacifico/LICENSE
    to: licenses/pacifico-OFL.txt
  - from: node_modules/@fontsource/chango/LICENSE
    to: licenses/chango-OFL.txt
  - from: node_modules/@fontsource/montserrat/LICENSE
    to: licenses/montserrat-OFL.txt
  - from: node_modules/@fontsource/cinzel-decorative/LICENSE
    to: licenses/cinzel-decorative-OFL.txt
  - from: node_modules/@fontsource/press-start-2p/LICENSE
    to: licenses/press-start-2p-OFL.txt
  - from: node_modules/@fontsource/grenze-gotisch/LICENSE
    to: licenses/grenze-gotisch-OFL.txt
  - from: node_modules/@fontsource/caveat/LICENSE
    to: licenses/caveat-OFL.txt
  - from: node_modules/@fontsource/zilla-slab/LICENSE
    to: licenses/zilla-slab-OFL.txt
  - from: node_modules/@fontsource/oswald/LICENSE
    to: licenses/oswald-OFL.txt
  - from: node_modules/@fontsource/jetbrains-mono/LICENSE
    to: licenses/jetbrains-mono-OFL.txt
  - from: node_modules/@fontsource/bungee/LICENSE
    to: licenses/bungee-OFL.txt
win:
  executableName: Salinha
  # Helper do som da janela compartilhada (gerado por scripts/build-win.sh)
  extraResources:
    - from: resources/win/concord-audio.exe
      to: concord-audio.exe
    # Build genérico: o salinha-host do "Hospedar um servidor" (instala na VPS
    # pelo SSH). Gerado por scripts/build-host-deployer.sh; o build oficial não tem.
    - from: resources/host/salinha-host.exe
      to: host/salinha-host.exe
  target:
    - portable
    - nsis
portable:
  artifactName: Salinha-${version}-portable.${ext}
nsis:
  artifactName: Salinha-${version}-setup.${ext}
  # Registra o protocolo salinha:// (links de convite) na instalação. O
  # "protocols" abaixo não vale para o NSIS no electron-builder 26.
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# Links de convite (salinha://convite/<código>): macOS (Info.plist) e Linux
# (.desktop). No Windows quem registra é o build/installer.nsh e o próprio app
# (app.setAsDefaultProtocolClient).
protocols:
  - name: Salinha
    schemes:
      - salinha
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icon.png
  executableName: salinha
  # Build genérico: o salinha-host do "Hospedar um servidor" (scripts/build-host-deployer.sh).
  extraResources:
    - from: resources/host/salinha-host
      to: host/salinha-host
  target:
    - AppImage
  category: Network
# Runtime estático do AppImage (AppImage/type2-runtime): só precisa do
# fusermount3, não da libfuse2 que várias distros (Arch, Ubuntu 22.04+) não
# trazem. Sem FUSE nenhum, a instalação por usuário (site/install.sh) é o
# caminho: ela não usa FUSE.
toolsets:
  appimage: '1.0.3'
appImage:
  # Distribuímos apenas x64; o macro arch do AppImage expande para x86_64.
  artifactName: Salinha-${version}-x64.${ext}
npmRebuild: false
# Atualização automática: latest.yml + instalador servidos pelo próprio
# servidor da Salinha (<servidor>/updates/). A URL vem dos scripts de build.
publish:
  provider: generic
  url: ${env.CONCORD_UPDATE_URL}
