<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Celular: largura real do aparelho (sem isto o navegador desenha a 980 px e
         encolhe tudo) e viewport-fit=cover para as safe areas (env(safe-area-inset-*)). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Salinha</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: %CONCORD_MEDIA_SRC%; media-src %CONCORD_MEDIA_SRC%; frame-src https:; connect-src %CONCORD_CONNECT_SRC%"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
