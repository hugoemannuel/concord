# Deploy automático: a cada push/merge na main publica na VPS o backend, a página de download (site/), o app web
# (frontend/dist-web) e uma versão nova do app desktop (os apps abertos
# mostram "Nova atualização disponível"). Os instaladores da versão nova saem
# numa GitHub Release (tag v<versão>, com o GITHUB_TOKEN do próprio Actions);
# a VPS publica só os manifestos (latest*.yml) e o Caddy manda os downloads
# para a release (docs/adr/0028-atualizacoes-pelo-github-releases.md).
#
# Configuração do repositório (Settings → Secrets and variables → Actions):
#   Secrets:
#     VPS_SSH_KEY      chave SSH privada de deploy (acesso à VPS)
#     VPS_KNOWN_HOSTS  linha(s) de known_hosts da VPS (ssh-keyscan)
#     RELEASE_KEY      chave Ed25519 que assina as atualizações (backend/.release-key)
#     TECH_TEAM_USER_IDS  (opcional) ids, separados por vírgula, de quem move os
#                      cards das propostas; o deploy grava no .env da VPS
#   Variables:
#     DEPLOY_ENABLED   "true" para ligar o deploy (sem isso, nada roda)
#     VPS_HOST         ex.: root@1.2.3.4
#     PUBLIC_URL       ex.: https://1-2-3-4.sslip.io
#     SITE_URL         (opcional) página de download a conferir (padrão: https://salinha.bhrx.com.br)
#     WEB_URL          (opcional) app web a conferir, ex.: https://app-salinha.bhrx.com.br
#     SERVER_FALLBACK_URLS (opcional) endereços alternativos do servidor embutidos
#                      no app desktop (padrão: WEB_URL ou https://app-salinha.bhrx.com.br);
#                      o app usa o primeiro que responde se o PUBLIC_URL falhar
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez, na ordem dos commits.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Por enquanto (fase de desenvolvimento) os testes não rodam no Actions, para
  # economizar minutos: rode-os localmente (README). Só a conferência das
  # migrations continua, dentro do deploy, porque uma migration pulada em
  # produção não tem volta.
  deploy:
    # Só a main vai para a VPS (workflow_dispatch numa branch ou tag antiga não:
    # um binário antigo não sobe com o socket do systemd ativo).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    # Fixo no 24.04: no ubuntu-26.04 (kernel 7) o wine do electronuserland/builder:wine
    # falha ("wine: socket : Function not implemented") e o instalador não sai.
    runs-on: ubuntu-24.04
    # Criar a GitHub Release com os instaladores (scripts/github-release.mjs).
    permissions:
      contents: write
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      SITE_URL: ${{ vars.SITE_URL || 'https://salinha.bhrx.com.br' }}
      WEB_URL: ${{ vars.WEB_URL }}
      # Domínio próprio como reserva do sslip.io (bloqueado na rede de alguns usuários).
      SERVER_FALLBACK_URLS: ${{ vars.SERVER_FALLBACK_URLS || vars.WEB_URL || 'https://app-salinha.bhrx.com.br' }}
    steps:
      - uses: actions/checkout@v7

      # Número de migration repetido seria pulado em silêncio no banco
      # (docs/HOSPEDAGEM.md).
      - name: Migrations (números)
        run: node scripts/check-migrations.mjs

      # Nota acima do limite do servidor faria o PUT do changelog falhar só no
      # fim, com a versão já no ar. Aqui falha antes de publicar qualquer coisa.
      - name: Changelog (limites)
        run: node scripts/publish-changelog.mjs --check changelog/pending

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Acesso à VPS e chave de assinatura
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY" | scripts/write-key.sh ~/.ssh/id_ed25519 "OPENSSH PRIVATE KEY"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! pub=$(ssh-keygen -y -f ~/.ssh/id_ed25519 2>/dev/null); then
            echo "::error::secret VPS_SSH_KEY inválido — cole o arquivo inteiro da chave privada (com as linhas BEGIN/END)"
            exit 1
          fi
          echo "chave SSH de deploy (precisa estar no authorized_keys da VPS): $pub"

          printf '%s' "$RELEASE_KEY" | scripts/write-key.sh backend/.release-key "PRIVATE KEY"
          if ! openssl pkey -in backend/.release-key -noout 2>/dev/null; then
            echo "::error::secret RELEASE_KEY inválido — cole o conteúdo inteiro de backend/.release-key (com as linhas BEGIN/END)"
            exit 1
          fi
          echo "chave pública de assinatura:"
          openssl pkey -in backend/.release-key -pubout

      - name: Versão
        id: version
        run: |
          published=$(curl -fsS "${PUBLIC_URL%/}/updates/latest.yml" | awk '/^version:/ {print $2}' || true)
          local=$(node -p "require('./frontend/package.json').version")
          version=$(node scripts/next-version.mjs "${published:--}" "$local")
          echo "publicada: ${published:-nenhuma} → nova: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Antes do instalador: se o build web quebrar, nada é publicado.
      - name: App web
        working-directory: frontend
        run: |
          npm i -g yarn@1.22.22
          yarn install --frozen-lockfile --ignore-scripts
          yarn build:web

      - name: App desktop (instalador assinado)
        run: scripts/release-win.sh "${{ steps.version.outputs.version }}"

      - name: App desktop Linux (AppImage e .tar.gz assinados)
        run: scripts/release-linux.sh "${{ steps.version.outputs.version }}"

      # Antes da VPS: os latest*.yml que ela publica citam arquivos que o Caddy
      # manda buscar nesta release. Rascunho até ter todos os arquivos.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/github-release.mjs "${{ steps.version.outputs.version }}" backend/updates changelog/pending

      - name: Publicar na VPS (backend + página de download + app web + atualização do app)
        env:
          TECH_TEAM_USER_IDS: ${{ secrets.TECH_TEAM_USER_IDS }}
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
        run: scripts/deploy-vps.sh "$VPS_HOST"

      - name: Conferir
        run: |
          curl -fsS "${PUBLIC_URL%/}/updates/latest.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
          curl -fsS "${PUBLIC_URL%/}/updates/latest-linux.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
          curl -fsS "${PUBLIC_URL%/}/updates/latest-linux-tar.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
          # Os instaladores e as .sig podem vir do disco ou, com o Caddyfile
          # novo, da GitHub Release (302): -L segue até o arquivo.
          for manifest in latest.yml latest-linux.yml latest-linux-tar.yml; do
            path=$(curl -fsS "${PUBLIC_URL%/}/updates/$manifest" | awk '/^path:/ {print $2}' | tr -d "\"'")
            test -n "$path"
            curl -fsSIL "${PUBLIC_URL%/}/updates/$path"
            curl -fsSL "${PUBLIC_URL%/}/updates/$path.sig" | grep -q .
            curl -fsSIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/download/v${{ steps.version.outputs.version }}/$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "${PUBLIC_URL%/}/rtc/validate")" = 401
          curl -fsS "${PUBLIC_URL%/}/healthz" | grep -q '"ok"'
          if [[ -n "$SITE_URL" ]]; then
            curl -fsS "${SITE_URL%/}/" | grep -q 'data-download'
            curl -fsS "${SITE_URL%/}/updates/latest.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
            curl -fsS "${SITE_URL%/}/updates/latest-linux.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
            curl -fsS "${SITE_URL%/}/updates/latest-linux-tar.yml" | grep -q "version: ${{ steps.version.outputs.version }}"
            curl -fsS "${SITE_URL%/}/install.sh" | grep -q 'latest-linux-tar.yml'
            # A chave pública embutida é a mesma que assina as atualizações.
            curl -fsS "${SITE_URL%/}/install.sh" | grep -A20 "^SALINHA_PUBKEY='" | grep -q "$(openssl pkey -in backend/.release-key -pubout | sed -n 2p)"
            echo "Página de download no ar em ${SITE_URL%/}"
          fi
          if [[ -n "$WEB_URL" ]]; then
            curl -fsS "${WEB_URL%/}/" | grep -q '<div id="root">'
            # Rota funda: o Caddy devolve o index.html (fallback de SPA).
            curl -fsS "${WEB_URL%/}/friends" | grep -q '<div id="root">'
            # Link de convite (/convite/<código>) também é rota do app.
            curl -fsS "${WEB_URL%/}/convite/ABCD2345" | grep -q '<div id="root">'
            test "$(curl -s -o /dev/null -w '%{http_code}' "${WEB_URL%/}/api/users/me")" = 401
            test "$(curl -s -o /dev/null -w '%{http_code}' "${WEB_URL%/}/rtc/validate")" = 401
            echo "App web no ar em ${WEB_URL%/}"
          fi
          echo "Salinha ${{ steps.version.outputs.version }} no ar em ${PUBLIC_URL%/}"

      # Depois do "Conferir": a versão já está no ar e o endpoint novo também.
      # O PUT é idempotente; o servidor guarda só as notas cujo arquivo nenhuma
      # versão anterior trouxe, porque changelog/pending/ acumula entre deploys.
      - name: Changelog
        env:
          CHANGELOG_TOKEN: ${{ secrets.CHANGELOG_TOKEN }}
        run: node scripts/publish-changelog.mjs "${{ steps.version.outputs.version }}" changelog/pending "$PUBLIC_URL"

      - name: Limpar chaves
        if: always()
        run: rm -f ~/.ssh/id_ed25519 backend/.release-key
